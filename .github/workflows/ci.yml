name: CI

on:
  push:
    branches: [main]
  pull_request:

# Bei schnell aufeinanderfolgenden Pushes laeuft nur der neueste Job weiter.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Linten
        run: npm run lint

      # build:tina erzeugt zuerst den GraphQL-Client (den die Seiten
      # importieren) und baut dann Next. Ohne echte Tina-Zugangsdaten
      # schlaegt die Abfrage an TinaCloud fehl – die Seiten fallen dann auf
      # die JSON-Dateien im Repo zurueck, der Build laeuft also durch.
      # Die Typpruefung steckt in "next build"; ein separates "tsc --noEmit"
      # wuerde vorher fehlschlagen, weil Next.js Typen wie LayoutProps erst
      # waehrend des Builds nach .next/types schreibt.
      - name: Bauen
        run: npm run build:tina
        env:
          NEXT_PUBLIC_TINA_CLIENT_ID: ci
          TINA_TOKEN: ci
